<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>小小金牌消费者 双人抢答</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{background:#87e8de;margin:0;padding:20px;text-align:center}
.box{background:#fff;border-radius:16px;padding:24px;max-width:800px;margin:0 auto}
.title{font-size:26px;font-weight:bold;color:#222;margin-bottom:20px}
.team{display:flex;justify-content:space-around;margin-bottom:20px}
.player{padding:12px 20px;border-radius:12px;background:#e8f4ff}
.name{font-size:20px;font-weight:bold}
.score{font-size:28px;color:#d63031;font-weight:bold}
.question{font-size:22px;margin:30px 0;min-height:60px;padding:10px}
.btn-group{display:flex;gap:20px;justify-content:center;margin:20px 0}
button{padding:14px 40px;font-size:22px;border:none;border-radius:10px;cursor:pointer}
#btnT{background:#00b894;color:white}
#btnF{background:#e17055;color:white}
#nextBtn{background:#0984e3;color:white;margin-top:10px;display:none}
.feedback{font-size:24px;font-weight:bold;margin:16px}
</style>
</head>
<body>
<div class="box">
<div class="title">小小金牌消费者 · 双人抢答PK</div>
<div class="team">
<div class="player">
<div class="name">小明同学</div>
<div>得分：<span class="score" id="s1">0</span></div>
</div>
<div class="player">
<div class="name">小强同学</div>
<div>得分：<span class="score" id="s2">0</span></div>
</div>
</div>
<div class="question" id="q">准备开始抢答！请选择一位同学答题</div>
<div class="btn-group">
<button id="btnX">小明答题</button>
<button id="btnQ">小强答题</button>
</div>
<div class="btn-group" id="tfBox" style="display:none">
<button id="btnT">√ 正确</button>
<button id="btnF">× 错误</button>
</div>
<div class="feedback" id="fb"></div>
<button id="nextBtn">下一题</button>
</div>

<script>
const qList = [
{q:"1. 购买食品，我们要查看包装上的生产日期和保质期。",ans:true},
{q:"2. 价格很便宜的三无产品，我们也可以放心购买。",ans:false},
{q:"3. 商品包装上的各类标识，可以告诉我们商品的安全信息。",ans:true},
{q:"4. 购物结束拿到小票，觉得没用就可以随手扔掉。",ans:false},
{q:"5. 选购衣服时，我们可以查看衣服内侧的洗涤标识。",ans:true},
{q:"6. 当商品出现质量问题，保留好发票有助于我们维护自身权益。",ans:true},
{q:"7. 只要包装好看的零食，就代表它是安全合格的商品。",ans:false},
{q:"8. 带有绿色食品标识的农产品，代表它符合相关安全标准。",ans:true},
{q:"9. 只有买大件贵重物品的时候，才需要索要购物发票。",ans:false},
{q:"10. 药品的说明书属于商品包装的一部分，购买药品要仔细阅读。",ans:true}
];
let idx=0,nowPlayer=null,score1=0,score2=0;
const qEl=document.getElementById("q");
const s1El=document.getElementById("s1");
const s2El=document.getElementById("s2");
const fbEl=document.getElementById("fb");
const tfBox=document.getElementById("tfBox");
const nextBtn=document.getElementById("nextBtn");
document.getElementById("btnX").onclick=()=>{nowPlayer="xiaoming";showQ()}
document.getElementById("btnQ").onclick=()=>{nowPlayer="xiaoqiang";showQ()}
function showQ(){
tfBox.style.display="flex";
fbEl.innerText="";
qEl.innerText=qList[idx].q;
}
document.getElementById("btnT").onclick=()=>check(true);
document.getElementById("btnF").onclick=()=>check(false);
function check(sel){
tfBox.style.display="none";
const right=qList[idx].ans;
if(sel===right){
fbEl.innerText="✅回答正确！加分";
if(nowPlayer==="xiaoming") score1++;
else score2++;
}else{
fbEl.innerText="❌回答错误，不得分";
}
s1El.innerText=score1;
s2El.innerText=score2;
nextBtn.style.display="block";
}
nextBtn.onclick=()=>{
idx++;
nextBtn.style.display="none";
fbEl.innerText="";
if(idx>=qList.length){
qEl.innerText="🎉全部题目完成！比赛结束";
tfBox.style.display="none";
return;
}
qEl.innerText="请选择小明或小强答题";
}
</script>
</body>
</html>
